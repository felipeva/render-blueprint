name: release

on:
  push:
    tags: ['v*']

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Require the tag to name the package version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json, which expects $expected" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Publish, with provenance only from a public repository
        run: |
          flags=''
          if [ "$REPOSITORY_VISIBILITY" = public ]; then flags='--provenance'; fi
          npm publish --access public $flags
        env:
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
